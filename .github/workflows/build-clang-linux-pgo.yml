name: Build clang linux PGO

# Build clang and lld 22.1.8 with -O3 + PGO for RockyLinux 8 (glibc 2.28),
# x64 and arm64, using the upstream 3-stage flow. Split into two chained jobs
# per arch to stay under the 6h hosted-job cap. The final job publishes the
# install tree to this repo's releases.

on:
  push:
    branches: [ clang-linux-pgo ]
  workflow_dispatch:

env:
  LLVM_VER: 22.1.8

jobs:
  stage1:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rockylinux:8
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build deps
        run: |
          echo "install_weak_deps=false" >> /etc/dnf/dnf.conf
          dnf -y install 'dnf-command(config-manager)'
          dnf config-manager --set-enabled powertools
          dnf -y install gcc-toolset-11 cmake ninja-build python3.12 git xz zlib-devel curl tar unzip binutils-devel findutils

      - name: Fetch sources
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/llvm-project-${LLVM_VER}.src.tar.xz"
          tar -xf llvm.tar.xz
          mv "llvm-project-${LLVM_VER}.src" llvm-project

      - name: Stage 1 (gcc-toolset-11 -> clang+lld+compiler-rt)
        run: |
          source /opt/rh/gcc-toolset-11/enable
          cmake -G Ninja -S llvm-project/llvm -B stage1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/stage1
          ninja -C stage1 install
          /opt/stage1/bin/clang++ --version | head -n1

      - name: Stage 2 instrumented + training
        run: |
          cmake -G Ninja -S llvm-project/llvm -B stage2i \
            -DCMAKE_C_COMPILER=/opt/stage1/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/stage1/bin/clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_BUILD_INSTRUMENTED=IR \
            -DLLVM_BUILD_RUNTIME=No \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF
          ninja -C stage2i clang lld
          # the name makes clang pass lld-style LTO options instead of loading LLVMgold.so
          mkdir -p /tmp/bin-instr
          cp stage2i/bin/lld /tmp/bin-instr/ld.lld
          # clang training: compile a slice of LLVM itself with the instrumented clang
          export LLVM_PROFILE_FILE=/tmp/prof/%m-%p.profraw
          mkdir -p /tmp/prof
          cmake -G Ninja -S llvm-project/llvm -B train \
            -DCMAKE_C_COMPILER=$PWD/stage2i/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/stage2i/bin/clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF
          ninja -C train LLVMSupport LLVMCore LLVMAnalysis
          # the same Support sources as ThinLTO bitcode, for the lld training below
          cmake -G Ninja -S llvm-project/llvm -B train-lto \
            -DCMAKE_C_COMPILER=$PWD/stage2i/bin/clang \
            -DCMAKE_CXX_COMPILER=$PWD/stage2i/bin/clang++ \
            -DCMAKE_AR=/opt/stage1/bin/llvm-ar -DCMAKE_RANLIB=/opt/stage1/bin/llvm-ranlib \
            -DCMAKE_C_FLAGS=-flto=thin -DCMAKE_CXX_FLAGS=-flto=thin \
            -DCMAKE_EXE_LINKER_FLAGS=--ld-path=/opt/stage1/bin/ld.lld \
            -DCMAKE_SHARED_LINKER_FLAGS=--ld-path=/opt/stage1/bin/ld.lld \
            -DCMAKE_MODULE_LINKER_FLAGS=--ld-path=/opt/stage1/bin/ld.lld \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF
          ninja -C train-lto LLVMSupport
          # lld training: link the Support objects into a shared library plainly and with
          # ThinLTO, which is the shape of the MeshLib bindings links.
          find train/lib/Support train/lib/Demangle -name '*.o' > /tmp/objs.txt
          find train-lto/lib/Support train-lto/lib/Demangle -name '*.o' > /tmp/objs-lto.txt
          wc -l /tmp/objs.txt /tmp/objs-lto.txt
          # Without LLD_IN_TEST lld leaves via _exit(), skipping the profile writer.
          export LLD_IN_TEST=1
          n0=$( ls /tmp/prof | wc -l )
          for i in 1 2 3 ; do
            /opt/stage1/bin/clang++ -fuse-ld=lld --ld-path=/tmp/bin-instr/ld.lld -shared \
              @/tmp/objs.txt -o /tmp/train.so
            /opt/stage1/bin/clang++ -fuse-ld=lld --ld-path=/tmp/bin-instr/ld.lld -shared -Oz -flto=thin -s -Wl,--icf=all \
              @/tmp/objs-lto.txt -o /tmp/train-lto.so
          done
          n1=$( ls /tmp/prof | wc -l )
          echo "$(( n1 - n0 )) raw profiles from lld"
          [[ $(( n1 - n0 )) -ge 1 ]] || { echo "the instrumented lld wrote no profile" >&2 ; exit 1 ; }
          /opt/stage1/bin/llvm-profdata merge -output=/tmp/llvm.profdata /tmp/prof/*.profraw
          ls -la /tmp/llvm.profdata
          tar -czf /tmp/bench-objs.tar.gz -T /tmp/objs.txt -T /tmp/objs-lto.txt -C /tmp objs.txt objs-lto.txt

      - name: Pack stage artifacts
        run: |
          tar -C /opt -czf /tmp/stage1-${{ matrix.arch }}.tar.gz stage1
          ls -la /tmp/stage1-${{ matrix.arch }}.tar.gz /tmp/llvm.profdata /tmp/bench-objs.tar.gz

      - name: Upload stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage1-${{ matrix.arch }}
          path: |
            /tmp/stage1-${{ matrix.arch }}.tar.gz
            /tmp/llvm.profdata
            /tmp/bench-objs.tar.gz
          retention-days: 3
          compression-level: 0

  final:
    needs: stage1
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rockylinux:8
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build deps
        run: |
          echo "install_weak_deps=false" >> /etc/dnf/dnf.conf
          dnf -y install 'dnf-command(config-manager)'
          dnf config-manager --set-enabled powertools
          dnf -y install gcc-toolset-11 cmake ninja-build python3.12 git xz zlib-devel curl tar unzip binutils-devel findutils

      - name: Fetch sources
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/llvm-project-${LLVM_VER}.src.tar.xz"
          tar -xf llvm.tar.xz
          mv "llvm-project-${LLVM_VER}.src" llvm-project

      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          name: stage1-${{ matrix.arch }}
          path: /tmp/

      - name: Unpack stage1
        run: tar -C /opt -xzf /tmp/stage1-${{ matrix.arch }}.tar.gz

      # Dylib flavor: no LTO, distro-style libLLVM.so + libclang-cpp.so for
      # near-instant dynamic linking of clang tools (mrbind). The static+ThinLTO
      # flavor already published under clang-22.1.8-pgo-rockylinux8 stays as is;
      # see git history for its exact config.
      - name: Final build (-O3 + PGO, dylib)
        run: |
          cmake -G Ninja -S llvm-project/llvm -B final \
            -DCMAKE_C_COMPILER=/opt/stage1/bin/clang \
            -DCMAKE_CXX_COMPILER=/opt/stage1/bin/clang++ \
            -DLLVM_USE_LINKER=/opt/stage1/bin/ld.lld \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_PROFDATA_FILE=/tmp/llvm.profdata \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/llvm-pgo-dylib-22.1.8
          ninja -C final install
          /opt/llvm-pgo-dylib-22.1.8/bin/clang++ --version | head -n1
          ls /opt/llvm-pgo-dylib-22.1.8/lib/libLLVM.so /opt/llvm-pgo-dylib-22.1.8/lib/libclang-cpp.so

      - name: Bench lld against the previous release's, min of 5 links each
        run: |
          mkdir -p /tmp/bench /tmp/old
          tar -C /tmp/bench -xzf /tmp/bench-objs.tar.gz
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/clang-22.1.8-pgo-dylib-linux/clang-22.1.8-pgo-dylib-linux-$( uname -m ).tar.gz" \
            | tar -C /tmp/old -xz --wildcards 'llvm-pgo-dylib-22.1.8/bin/lld' 'llvm-pgo-dylib-22.1.8/lib/libLLVM.so*'
          ln -s lld /tmp/old/llvm-pgo-dylib-22.1.8/bin/ld.lld
          bench() # $1 = ld.lld, $2... = link arguments
          {
            local ld="$1" ; shift
            TIMEFORMAT=%R
            for i in 1 2 3 4 5 ; do
              { time /opt/stage1/bin/clang++ -fuse-ld=lld --ld-path="$ld" -shared "$@" -o /tmp/bench.so >/dev/null 2>&1 ; } 2>&1
            done | sort -n | head -n 1
          }
          cd /tmp/bench
          OLD=/tmp/old/llvm-pgo-dylib-22.1.8/bin/ld.lld
          NEW=/opt/llvm-pgo-dylib-22.1.8/bin/ld.lld
          "$NEW" --version
          # checked warm-up links: the timed ones below discard their errors
          for ld in $OLD $NEW ; do
            /opt/stage1/bin/clang++ -fuse-ld=lld --ld-path=$ld -shared @objs.txt -o /tmp/bench.so
            /opt/stage1/bin/clang++ -fuse-ld=lld --ld-path=$ld -shared -Oz -flto=thin -s -Wl,--icf=all @objs-lto.txt -o /tmp/bench.so
          done
          echo "plain link:   old $( bench $OLD @objs.txt ) s, new $( bench $NEW @objs.txt ) s"
          echo "ThinLTO link: old $( bench $OLD -Oz -flto=thin -s -Wl,--icf=all @objs-lto.txt ) s, new $( bench $NEW -Oz -flto=thin -s -Wl,--icf=all @objs-lto.txt ) s"

      - name: Pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf -y install 'dnf-command(config-manager)' >/dev/null 2>&1 || true
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf -y install gh
          # a new tag, so the consumers of clang-22.1.8-pgo-dylib-linux move to it explicitly
          TAG=clang-22.1.8_2-pgo-dylib-linux
          NAME="$TAG-$( uname -m ).tar.gz"
          tar -C /opt -czf "/tmp/$NAME" llvm-pgo-dylib-22.1.8
          ( cd /tmp && sha256sum "$NAME" | tee "$NAME.sha256" )
          gh release create $TAG -R "$GITHUB_REPOSITORY" \
            --title "clang 22.1.8 PGO dylib with PGO lld (Linux)" \
            --notes "clang/lld 22.1.8 built with -O3 + IR-PGO (no LTO), RTTI, and distro-style libLLVM.so/libclang-cpp.so in a rockylinux:8 container (glibc 2.28). Stage1 gcc-toolset-11; training = compiling LLVMSupport/Core/Analysis, then linking the Support objects into a shared library with the instrumented lld, plainly and with -flto=thin -Wl,--icf=all. Unlike clang-22.1.8-pgo-dylib-linux, whose profile had no lld counts, lld is PGO-trained too. Install prefix inside the tarball: llvm-pgo-dylib-22.1.8/." \
            2>/dev/null || echo "release exists"
          gh release upload $TAG -R "$GITHUB_REPOSITORY" --clobber "/tmp/$NAME" "/tmp/$NAME.sha256"
