name: Probe the self-hosted macOS runners

# Cheap survey before committing hours of lld builds to these machines: OS and SDK version,
# cores, free disk, and whether the llvm-pgo keg's Clang runs there at all.

on:
  push:
    paths: [ '.github/workflows/probe-macos-runners.yml' ]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [ macos-12-intel, macos-13 ]
    runs-on: [ self-hosted, "${{ matrix.label }}" ]
    timeout-minutes: 15
    steps:
      - name: Survey
        run: |
          echo "== label ${{ matrix.label }} on $( hostname )"
          sw_vers
          echo "arch: $( uname -m ), cores: $( sysctl -n hw.logicalcpu ), ram: $(( $( sysctl -n hw.memsize ) / 1073741824 )) GiB"
          echo "-- cpu"
          sysctl -n machdep.cpu.brand_string || true
          echo "-- disk"
          df -h / /tmp | tail -n +1
          echo "-- xcode / sdk"
          xcodebuild -version || true
          xcrun --show-sdk-path || true
          xcrun --show-sdk-version || true
          echo "-- tools"
          for t in brew cmake ninja git ; do printf '%s: %s\n' "$t" "$( command -v $t || echo MISSING )" ; done
          BP="$( brew --prefix 2>/dev/null || echo none )" ; echo "brew prefix: $BP"
          echo "-- llvm-pgo keg"
          KEG="$BP/Cellar/llvm-pgo/22.1.8_2"
          if [[ -x "$KEG/bin/clang++" ]] ; then
            "$KEG/bin/clang++" --version | head -n1
            otool -l "$KEG/bin/clang++" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -n 12
          else
            echo "keg absent at $KEG"
          fi
          echo "-- existing lld, if any"
          command -v ld64.lld || echo "no ld64.lld in PATH"
